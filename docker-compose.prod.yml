# 本番用。DB は RDS を使うので、db と phpMyAdmin のコンテナは作らない
services:
  # Nginx（Webサーバー）
  nginx:
    image: nginx:latest
    ports:
      # 127.0.0.1 = EC2 の中からだけ受け付ける（外からは EC2 の Nginx 経由で来る）
      # 8000・8001 はブログアプリが使っているので 
      - "127.0.0.1:8002:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: unless-stopped   # EC2 を再起動しても自動で起動する

  # PHP-FPM（アプリケーション）
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/uploads.ini
    restart: unless-stopped